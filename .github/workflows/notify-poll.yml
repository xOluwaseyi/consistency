name: Notification poll

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the notification poll endpoint
        run: |
          curl -sf -X GET "https://useconsistency.vercel.app/api/cron/poll" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
